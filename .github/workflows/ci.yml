name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile Native App
        run: bash app/build.sh

      - name: Package DMG
        run: bash scripts/package_dmg.sh

      - name: Run CLI Doctor
        run: bun bin/dsh-desktop.mjs doctor || true

  gate8-recovery:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Portable operator tests
        run: npm run test:gate8
      - name: Version-pinned Maestro patch tests
        run: npm run test:maestro
