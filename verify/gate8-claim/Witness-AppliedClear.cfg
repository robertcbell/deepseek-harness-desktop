\* non-vacuity: expect NeverAppliedClear violated (a clear accepts a recorded PATCH that has applied as the claim)
SPECIFICATION Spec
CONSTANTS
    Claimers = {c1, c2}
    UseLock = TRUE
    CheckStatus = TRUE
    HoldToEnd = TRUE
    Readback = TRUE
    Faults = TRUE
    KeepOnAmbiguous = TRUE
    KeepOnDefinite = FALSE
    AllowClear = TRUE
    ClearMode = "match"
INVARIANTS TypeOK NeverAppliedClear
PROPERTIES AllDone
CHECK_DEADLOCK FALSE
