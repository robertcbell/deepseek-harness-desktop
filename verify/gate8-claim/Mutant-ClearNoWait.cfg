\* M8 = the old advice (remove the lock once no claimer runs): clear while a PATCH is in flight: expect OneOwner violated
SPECIFICATION Spec
CONSTANTS
    Claimers = {c1, c2}
    UseLock = TRUE
    CheckStatus = TRUE
    HoldToEnd = TRUE
    Readback = TRUE
    Faults = TRUE
    KeepOnAmbiguous = TRUE
    KeepOnDefinite = FALSE
    AllowClear = TRUE
    ClearWaits = FALSE
INVARIANTS TypeOK OneOwner
PROPERTIES AllDone
CHECK_DEADLOCK FALSE
