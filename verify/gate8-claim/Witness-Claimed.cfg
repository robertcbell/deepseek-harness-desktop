\* non-vacuity: expect NeverClaimed violated (a claim succeeds)
SPECIFICATION Spec
CONSTANTS
    Claimers = {c1, c2}
    UseLock = TRUE
    CheckStatus = TRUE
    HoldToEnd = TRUE
    Readback = TRUE
    Faults = TRUE
    KeepOnAmbiguous = TRUE
    KeepOnDefinite = FALSE
    AllowClear = TRUE
    ClearMode = "match"
INVARIANTS TypeOK NeverClaimed
PROPERTIES AllDone
CHECK_DEADLOCK FALSE
