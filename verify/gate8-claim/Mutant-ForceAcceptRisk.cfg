\* --force-accept-risk (and the old "delete the lock" advice): clear regardless of the record: expect OneOwner violated (the documented risk)
SPECIFICATION Spec
CONSTANTS
    Claimers = {c1, c2}
    UseLock = TRUE
    CheckStatus = TRUE
    HoldToEnd = TRUE
    Readback = TRUE
    Faults = TRUE
    KeepOnAmbiguous = TRUE
    KeepOnDefinite = FALSE
    AllowClear = TRUE
    ClearMode = "any"
INVARIANTS TypeOK OneOwner
PROPERTIES AllDone
CHECK_DEADLOCK FALSE
