\* non-vacuity: expect NeverFailed violated (a definite 4xx ends a claim)
SPECIFICATION Spec
CONSTANTS
    Claimers = {c1, c2}
    UseLock = TRUE
    CheckStatus = TRUE
    HoldToEnd = TRUE
    Readback = TRUE
    Faults = TRUE
    KeepOnAmbiguous = TRUE
    KeepOnDefinite = FALSE
INVARIANTS TypeOK NeverFailed
PROPERTIES AllDone
CHECK_DEADLOCK FALSE
