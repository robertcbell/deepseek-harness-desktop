\* non-vacuity: expect NeverLanded violated (a timed-out PATCH is applied later)
SPECIFICATION Spec
CONSTANTS
    Claimers = {c1, c2}
    UseLock = TRUE
    CheckStatus = TRUE
    HoldToEnd = TRUE
    Readback = TRUE
    Faults = TRUE
    KeepOnAmbiguous = TRUE
    KeepOnDefinite = FALSE
    AllowClear = TRUE
    ClearMode = "match"
INVARIANTS TypeOK NeverLanded
PROPERTIES AllDone
CHECK_DEADLOCK FALSE
